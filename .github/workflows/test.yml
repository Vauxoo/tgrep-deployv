name: build
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

env:
  CACHE_VERSION: 1
  PRE_COMMIT_CACHE: ~/.cache/pre-commit

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15-dev"]
        os: [ubuntu-latest, windows-latest, macos-latest]
        tox_env: [py-multi]
        include:
          - python: "3.14"
            os: ubuntu-latest
            tox_env: "lint"
          - python: "3.14"
            os: ubuntu-latest
            tox_env: "build"
        exclude:
          # macos-latest is an ARM runner, only supporting newer versions of Python
          # https://github.com/actions/setup-python/issues/825#issuecomment-2096792396
          - python: "3.10"
            os: macos-latest

    steps:
      - name: Set git to not change EoL
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
      - name: Cache pre-commit packages
        id: cache-pre-commit
        uses: actions/cache@v5
        with:
          path: ${{ env.PRE_COMMIT_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python }}-pre-commit
      - uses: actions/checkout@v7
        with:
          # pbr needs the full git history to generate the ChangeLog
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: "x64"
          cache: "pip"
      - name: install dependencies
        run: |
          python -mpip install --progress-bar=off -r test-requirements.txt
          pip --version
          pip list --format=freeze
      - name: Install tgrep with the package's own installer
        # Exercises the real download/checksum/extract path on every OS, and gives the
        # integration tests a tgrep binary to run against (they skip without one).
        if: startsWith(matrix.tox_env, 'py')
        shell: bash
        run: |
          PYTHONPATH=src python -c "from tgrep_deployv.indexer import ensure_tgrep_installed; print(ensure_tgrep_installed())"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Test
        run: tox -e ${{ matrix.tox_env }} -v
      # TODO: Publish package only for signed tags
      - name: Publish package
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags') && contains(matrix.tox_env, 'build')
        run: |
          ls -lah dist/*
          python -m twine upload --verbose -u __token__ -p ${{ secrets.PYPI_API_TOKEN }} --repository-url https://upload.pypi.org/legacy/ dist/*
      - name: codecov
        if: startsWith(matrix.tox_env, 'py') # only coverage in python tests
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
